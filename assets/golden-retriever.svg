<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="200" height="150" role="img" aria-label="Illustration of a Golden Retriever">
  <!-- Background -->
  <rect width="200" height="150" fill="#fdf3e0" rx="16"/>

  <!-- Body -->
  <ellipse cx="100" cy="100" rx="46" ry="28" fill="#e5b45c"/>

  <!-- Head -->
  <circle cx="100" cy="60" r="30" fill="#f0c675"/>

  <!-- Floppy ears -->
  <ellipse cx="70" cy="68" rx="13" ry="22" fill="#d9a04a"/>
  <ellipse cx="130" cy="68" rx="13" ry="22" fill="#d9a04a"/>

  <!-- Muzzle -->
  <ellipse cx="100" cy="76" rx="19" ry="13" fill="#fceccb"/>

  <!-- Nose -->
  <ellipse cx="100" cy="71" rx="6" ry="4" fill="#3a2a1a"/>

  <!-- Eyes -->
  <circle cx="88" cy="56" r="4" fill="#3a2a1a"/>
  <circle cx="112" cy="56" r="4" fill="#3a2a1a"/>
  <circle cx="89" cy="55" r="1.4" fill="#ffffff"/>
  <circle cx="113" cy="55" r="1.4" fill="#ffffff"/>

  <!-- Smiling mouth -->
  <path d="M92 83 Q100 92 108 83" stroke="#3a2a1a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Tail (wagging) -->
  <path d="M144 94 Q166 80 158 62" stroke="#e5b45c" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Legs -->
  <rect x="70" y="116" width="11" height="22" rx="4" fill="#c9923c"/>
  <rect x="119" y="116" width="11" height="22" rx="4" fill="#c9923c"/>
</svg>